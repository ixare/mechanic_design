<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 专为 16x16 / 32x32 小尺寸高辨识度打造的先锋大模数机械齿轮 Favicon -->
  <defs>
    <filter id="gear-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- 齿轮主体路径：6 齿大模数重型工业齿轮，轮廓饱满，负空间通透 -->
  <path fill="#ff471a" stroke="#d4320b" stroke-width="1.5" stroke-linejoin="round" filter="url(#gear-shadow)" d="
    M 36,4 L 28,4 L 27.5,14.2 
    L 20.3,10.0 L 14.3,17.0 L 21.2,23.3 
    L 16.5,29.0 L 6.5,29.0 L 6.5,39.0 L 16.5,39.0 
    L 21.2,44.7 L 14.3,51.0 L 20.3,58.0 L 27.5,53.8 
    L 28,64 L 36,64 L 36.5,53.8 
    L 43.7,58.0 L 49.7,51.0 L 42.8,44.7 
    L 47.5,39.0 L 57.5,39.0 L 57.5,29.0 L 47.5,29.0 
    L 42.8,23.3 L 49.7,17.0 L 43.7,10.0 L 36.5,14.2 Z
  " />

  <!-- 内部中心大轴孔与平键槽（大对比度负空间，极小尺寸下依然一眼可见） -->
  <circle cx="32" cy="34" r="11" fill="#0c1718" stroke="#ffffff" stroke-width="2" />
  <rect x="30" y="21" width="4" height="6" fill="#0c1718" />
  
  <!-- 中心轴心高亮指示点 -->
  <circle cx="32" cy="34" r="4.5" fill="#00f0b5" />
</svg>
