name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validate question bank
        run: npm run validate

      - name: Run test suite
        run: npm test

      - name: Check JS syntax
        run: |
          for f in app.js sw.js js/*.js scripts/*.mjs; do
            node --check "$f"
          done
